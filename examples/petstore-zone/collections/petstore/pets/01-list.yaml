name: List pets
method: GET
url: "{{base_url}}/pets"
query:
  kind: "{{kind}}"
vars:
  kind: dog        # request default; override with --var kind=cat or from a flow step
tests:
  - status: 200
  - json:
      total: {gte: 1}
      "items[0].kind": "{{kind}}"
      "length(items)": {gte: 1}
  - headers:
      x-total-count: {exists: true}
  - expr: "json.total == length(json.items)"
captures:
  first_pet_id: json.items[0].id
