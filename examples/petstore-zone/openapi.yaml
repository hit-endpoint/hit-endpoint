openapi: "3.0.3"
info:
  title: Petstore API
  version: "1.0.0"
  description: Sample OpenAPI 3 spec for Petstore API
paths:
  /health:
    get:
      summary: Server health check
      responses:
        "200":
          description: Healthy
  /auth/login:
    post:
      summary: User authentication
      responses:
        "200":
          description: Authentication successful
        "401":
          description: Unauthorized
  /pets:
    get:
      summary: List all pets
      responses:
        "200":
          description: Paged list of pets
    post:
      summary: Create a new pet
      responses:
        "201":
          description: Pet created
        "400":
          description: Invalid pet payload
  /pets/{id}:
    get:
      summary: Fetch pet by ID
      responses:
        "200":
          description: Pet found
        "404":
          description: Pet not found
    delete:
      summary: Delete pet by ID
      responses:
        "204":
          description: Pet deleted
        "404":
          description: Pet not found
  /pets/{id}/photo:
    post:
      summary: Upload pet photo (untested endpoint)
      responses:
        "200":
          description: Photo uploaded
